# Uitrol naar Cloudflare Workers (fase 0 stap E). Alleen vanaf main, en alleen nadat de poort (workflow check) op
# die commit groen was. Een pull request rolt nooit uit. Uitleg en eenmalige instellingen: docs/hosting.md.
name: uitrol

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  # Met de hand opnieuw uitrollen (bijvoorbeeld na het zetten van de geheimen); alleen vanaf main, zie de job.
  workflow_dispatch:

permissions:
  contents: read

# Nooit twee uitrollen tegelijk; een lopende uitrol wordt afgemaakt.
concurrency:
  group: uitrol
  cancel-in-progress: false

jobs:
  uitrol:
    name: uitrol
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # De Cloudflare-sleutel staat alleen in deze omgeving, en die is in GitHub beperkt tot main.
    environment:
      name: ontwikkel
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Precies de commit waarop check groen was, niet wat er intussen op main staat.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden
        run: npm ci

      - name: Bouwen (Next.js en OpenNext)
        run: npm run build:worker

      - name: Uitrollen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npm run deploy:worker

      # Bewijs dat de nieuwe versie online antwoordt met de beveiligingsheaders (stap E, punt 4).
      - name: Controle op de uitgerolde Worker
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          headers="$(curl --fail --silent --show-error --head "$SITE_URL/")"
          for naam in content-security-policy strict-transport-security x-content-type-options referrer-policy; do
            echo "$headers" | grep -qi "^$naam:" || { echo "Header $naam ontbreekt"; exit 1; }
          done
          curl --fail --silent --show-error --output /dev/null "$SITE_URL/inloggen"
          echo "De Worker antwoordt, met de beveiligingsheaders."
