# De poort (bouwgids 14.1): elke pull request en elke wijziging op main draait alle controles.
# Is één stap rood, dan kan de pull request niet worden samengevoegd.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions staan vast op een commit (niet op een tag die kan verschuiven); Dependabot houdt ze bij.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Alleen deze stap krijgt de namenlijst, als geheim. GitHub toont een geheim als *** in de log; elk woord
      # wordt bovendien apart gemaskeerd, omdat GitHub anders alleen de hele lijst als één tekst herkent.
      # Deze stap draait vóór alles uit de pull request (vóór npm ci en de poort), met het script uit main, niet uit
      # de pull request (review F0-21, PR14-01 en PR14-07). Anders kan een gewijzigd script, een test of een
      # installatiescript van een pakket de lijst in een andere vorm afdrukken, en dan helpt maskeren niet.
      # Wijzig je het script én de gegevens die het leest (uitzonderingen.json, licenties.md) op een manier die niet
      # samengaat, doe dat dan in twee pull requests: eerst het script, dan de gegevens.
      # Een pull request uit een fork krijgt geen geheimen: dan faalt deze stap (geen lijst = geen groen) en
      # beoordeelt de beheerder de wijziging met de hand. Dependabot krijgt alleen Dependabot-geheimen: daar moet
      # dezelfde lijst ook staan (docs/hosting.md, Geheimen; review F0-04).
      - name: Publieke repository (controle:repo, het script uit main)
        env:
          VERBODEN_WOORDEN: ${{ secrets.VERBODEN_WOORDEN }}
        run: |
          IFS=','
          for woord in $VERBODEN_WOORDEN; do
            woord="$(echo "$woord" | xargs)"
            [ -n "$woord" ] && echo "::add-mask::$woord"
          done
          unset IFS
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/basis"
          echo '{ "type": "module" }' > "$RUNNER_TEMP/basis/package.json"
          git show FETCH_HEAD:scripts/controleer-repo.ts > "$RUNNER_TEMP/basis/controleer-repo.ts"
          node "$RUNNER_TEMP/basis/controleer-repo.ts" --root .

      - name: Afhankelijkheden
        run: npm ci

      - name: Browser voor de browsertests
        run: npx playwright install --with-deps chromium

      # De lokale Supabase vooraf starten, met maximaal drie pogingen. Het ophalen van de images faalt soms op een
      # limiet van de registry ("toomanyrequests", 29-10-2026); dat zegt niets over de code. check:basis start hem
      # daarna opnieuw (doet dan niets) en zet de database schoon op.
      - name: Lokale Supabase starten (herhaalt bij een limiet)
        run: |
          for poging in 1 2 3; do
            npm run supabase:start && exit 0
            echo "Poging $poging mislukt; over 60 seconden opnieuw."
            sleep 60
          done
          exit 1

      # Deze stap krijgt de namenlijst niet.
      - name: De poort (npm run check:basis)
        run: npm run check:basis

      - name: Bekende lekken in afhankelijkheden (hoog of kritiek blokkeert)
        run: npm audit --audit-level=high

      # De uitrolstap heeft een eigen, kleine lockfile met alleen wrangler (uitrol/).
      - name: Bekende lekken in de afhankelijkheden van de uitrol
        run: npm audit --audit-level=high --prefix uitrol
