# De poort (bouwgids 14.1): elke pull request en elke wijziging op main draait alle controles.
# Is één stap rood, dan kan de pull request niet worden samengevoegd.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions staan vast op een commit (niet op een tag die kan verschuiven); Dependabot houdt ze bij.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden
        run: npm ci

      - name: Browser voor de browsertests
        run: npx playwright install --with-deps chromium

      # Deze stap krijgt de namenlijst niet.
      - name: De poort (npm run check:basis)
        run: npm run check:basis

      # Alleen deze stap krijgt de namenlijst, als geheim. GitHub toont een geheim als *** in de log; elk woord
      # wordt bovendien apart gemaskeerd, omdat GitHub anders alleen de hele lijst als één tekst herkent.
      # Het script komt uit de basis van de pull request (bij een push naar main: die commit zelf), niet uit de
      # pull request: anders kan een gewijzigd script de lijst in een andere vorm afdrukken, en dan helpt maskeren
      # niet (review F0-21). Grens: npm ci draaide al installatiescripts van pakketten op deze machine; daarom bevat
      # de lijst alleen namen, geen sleutels.
      # Een pull request uit een fork krijgt geen geheimen: dan faalt deze stap (geen lijst = geen groen) en
      # beoordeelt de beheerder de wijziging met de hand. Dependabot krijgt alleen Dependabot-geheimen: daar staat
      # dezelfde lijst ook (docs/hosting.md, review F0-04).
      - name: Publieke repository (controle:repo, het script uit de basis)
        env:
          VERBODEN_WOORDEN: ${{ secrets.VERBODEN_WOORDEN }}
          BASIS: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          IFS=','
          for woord in $VERBODEN_WOORDEN; do
            woord="$(echo "$woord" | xargs)"
            [ -n "$woord" ] && echo "::add-mask::$woord"
          done
          unset IFS
          git fetch --no-tags --depth=1 origin "$BASIS"
          mkdir -p "$RUNNER_TEMP/basis"
          echo '{ "type": "module" }' > "$RUNNER_TEMP/basis/package.json"
          git show "$BASIS:scripts/controleer-repo.ts" > "$RUNNER_TEMP/basis/controleer-repo.ts"
          node "$RUNNER_TEMP/basis/controleer-repo.ts" --root .

      - name: Bekende lekken in afhankelijkheden (hoog of kritiek blokkeert)
        run: npm audit --audit-level=high

      # De uitrolstap heeft een eigen, kleine lockfile met alleen wrangler (uitrol/).
      - name: Bekende lekken in de afhankelijkheden van de uitrol
        run: npm audit --audit-level=high --prefix uitrol
