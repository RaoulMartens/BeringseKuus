version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grote versie-updates (major) van TypeScript en ESLint bekijken we bewust, in een eigen pull request: ze
    # kunnen Next.js, eslint-config-next en de typebewuste lintregels breken. Kleine updates komen gewoon binnen.
    # Besluit 27-10-2026; zie Bouwbesluiten punt 9.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
